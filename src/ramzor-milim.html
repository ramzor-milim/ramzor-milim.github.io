<title>רמזור מילים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Varela+Round&display=swap">
<style>
/* Layout: one narrow column — sticky header with traffic-light filter chips, then a flashcard (practice) or a word list. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #172130; --muted: #5a6577; --line: #dce1e9; --accent: #24497a; --accent-ink: #ffffff;
  --red: #c93c3c; --red-soft: #fae5e5; --orange: #d07a12; --orange-soft: #fcefdb; --green: #24894f; --green-soft: #def2e5; --new: #8a94a3; --new-soft: #eceff3;
  --display: "Varela Round", "Assistant", "Segoe UI", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161e; --surface: #1a212c; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3645; --accent: #8fb3e6; --accent-ink: #0f1620;
  --red: #ec7070; --red-soft: #3a2124; --orange: #f0a548; --orange-soft: #3a2c1a; --green: #5cc58a; --green-soft: #1b3326; --new: #8792a3; --new-soft: #252d39;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161e; --surface: #1a212c; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3645; --accent: #8fb3e6; --accent-ink: #0f1620;
  --red: #ec7070; --red-soft: #3a2124; --orange: #f0a548; --orange-soft: #3a2c1a; --green: #5cc58a; --green-soft: #1b3326; --new: #8792a3; --new-soft: #252d39;
  color-scheme: dark }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, summary, a, label { -webkit-tap-highlight-color: transparent; }
/* Press feedback: every pressable thing confirms the tap */
.primary, .nav button, .btn-reveal, .chip, .seg-tabs button, .speak, .like, .how-link, .more, .danger, .composer button, .undo-bar button, .wm-close, .unit-pick summary {
  transition: transform 140ms var(--ease-out); }
.primary:active, .nav button:not(:disabled):active, .btn-reveal:active, .chip:active, .seg-tabs button:active, .speak:active, .like:active,
.how-link:active, .more:active, .danger:active, .composer button:not(:disabled):active, .undo-bar button:active, .wm-close:active, .unit-pick summary:active { transform: scale(0.97); }
.rate button, .nav button, .btn-reveal, .chip { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { overflow-x: clip; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.how-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 99px; padding: 4px 12px 4px 6px; font-size: .85rem; font-weight: 700; }
.how-link span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); font-weight: 800; font-size: .8rem; }
.how-link[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.home-link { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; border-radius: 10px; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 1.6rem; font-weight: 700; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
.lights { display: inline-flex; flex-direction: column; gap: 3px; padding: 4px; border-radius: 8px; background: var(--ink); }
.lights i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: var(--red); } .lights i:nth-child(2) { background: var(--orange); } .lights i:nth-child(3) { background: var(--green); }

.seg-tabs { display: inline-flex; background: var(--new-soft); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.seg-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.scope { display: flex; align-items: center; gap: 10px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-weight: 600; }
.scope .total { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

.unit-pick { position: relative; }
.unit-pick summary { list-style: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 30px 6px 12px; font-weight: 600; position: relative; white-space: nowrap; }
.unit-pick summary::-webkit-details-marker { display: none; }
.unit-pick summary::after { content: "▾"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .8rem; }
.unit-pick summary { padding: 6px 12px 6px 28px; }
.unit-menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 12px 30px rgb(0 0 0 / .14); width: min(320px, calc(100vw - 32px)); display: grid; gap: 8px;
  transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
  @starting-style { opacity: 0; transform: scale(0.97); } }
.unit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.unit-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: .9rem; }
.unit-opt input { width: 16px; height: 16px; accent-color: var(--accent); }
.unit-opt small { margin-inline-start: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-hint { margin: 0; font-size: .82rem; color: var(--accent); font-weight: 600; }
.unit-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
.gr { cursor: pointer; }
@media (hover: hover) and (pointer: fine) {
  .gr:hover, .unit-opt:hover, .speak:hover, .unit-row:hover { background: var(--bg); }
}
.wmodal { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .45); display: grid; place-items: start center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px));
  transition: opacity 200ms var(--ease-out); @starting-style { opacity: 0; } }
.wm-box { width: min(560px, 100%); background: var(--bg); border-radius: 18px; padding: 12px; display: grid; gap: 10px; margin-top: 4vh; box-shadow: 0 20px 50px rgb(0 0 0 / .3);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); @starting-style { opacity: 0; transform: scale(0.97); } }
.wm-top { display: flex; align-items: center; gap: 10px; }
.wm-top .muted-note { margin-inline-start: auto; }
.wm-close { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 32px; height: 32px; font-size: .9rem; }
.wm-card .word { padding-block: 6px 2px; }
.wm-card .reveal { min-height: 0; }
body.modal-open { overflow: hidden; }
.gsearch { position: relative; }
.gsearch input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--surface); font-size: 16px; }
.gres { position: absolute; top: calc(100% + 6px); inset-inline: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 14px 34px rgb(0 0 0 / .16); max-height: min(70vh, 560px); overflow-y: auto; padding: 6px; display: grid; gap: 4px; }
.gr { padding: 8px 10px; border-radius: 10px; display: grid; gap: 4px; }
.gr + .gr { border-top: 1px solid var(--line); border-radius: 0; }
.gr-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gr-main b { font-family: var(--display); font-size: 1.1rem; }
.gr-tag { margin-inline-start: auto; font-size: .75rem; color: var(--muted); }
.gr-m { color: var(--muted); font-size: .9rem; }
.gr-seg button { padding: 2px 10px; font-size: .78rem; }
.gr-more { padding: 6px 10px; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--new-soft); }
.bar span { display: block; height: 100%; transition: width 250ms var(--ease-out); }
.bar .b-g { background: var(--green); } .bar .b-o { background: var(--orange); } .bar .b-r { background: var(--red); } .bar .b-n { background: var(--new-soft); }

.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 8px; display: grid; justify-items: center; gap: 0; text-align: center; opacity: .55;
  transition: opacity 150ms ease, border-color 150ms ease, background-color 150ms ease, transform 140ms var(--ease-out); }
.chip[aria-pressed="true"] { opacity: 1; }
.chip .n { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.chip .l { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.chip[data-s="r"][aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); }
.chip[data-s="o"][aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.chip[data-s="g"][aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.chip[data-s="n"][aria-pressed="true"] { border-color: var(--new); background: var(--new-soft); }
.chip .check { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--muted); display: inline-block; position: relative; }
.chip[aria-pressed="true"] .check { background: var(--ink); border-color: var(--ink); }
.chip[aria-pressed="true"] .check::after { content: ""; position: absolute; inset: 1px 3px 3px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* phone: the header scrolls away with the page, except the colour chips, which stay pinned at the top */
@media (max-width: 560px) {
  header { top: calc(env(safe-area-inset-top, 0px) + var(--hdr-peek, 0px)); }
  header > .bar { order: 1; height: 4px; margin-top: -4px; }   /* thin progress line under the chips, pinned with them */
  #main { min-height: calc(100dvh - 80px); }   /* room to scroll the card up under the chips, even on short pages */
}
/* phone: the association box hint is smaller and gets room for two full lines instead of being cut off */
@media (max-width: 560px) {
  .assoc .composer textarea { min-height: 58px; }
  .assoc .composer textarea::placeholder { font-size: 13px; line-height: 1.4; }
}
/* narrow phone with the login button in the top row: "how it works" shrinks to its "?" circle so both fit on one line */
@media (max-width: 440px) {
  .title-row:has(.acct:not([hidden])) { flex-wrap: nowrap; }
  .title-row:has(.acct:not([hidden])) .how-link { font-size: 0; gap: 0; padding: 4px; }
  .title-row .acct { max-width: 130px; min-width: 0; }
}
/* phone: colour chips at about half the height (smaller number, one-line label) */
@media (max-width: 560px) {
  .chip { padding: 3px 4px; }
  .chip .n { font-size: 1rem; line-height: 1.15; }
  .chip .l { font-size: .68rem; gap: 3px; white-space: nowrap; line-height: 1.3; }
  .chip .check { width: 10px; height: 10px; }
  .chip .dot { width: 8px; height: 8px; }
}
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.s-r { background: var(--red); } .s-o { background: var(--orange); } .s-g { background: var(--green); } .s-n { background: transparent; border: 1.5px solid var(--new); }

.viewbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-block: 14px 10px; flex-wrap: wrap; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 20px; display: grid; gap: 14px; border-top: 12px solid var(--new); }
.card[data-s="r"] { border-top-color: var(--red); } .card[data-s="o"] { border-top-color: var(--orange); } .card[data-s="g"] { border-top-color: var(--green); }
.card-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.word { font-family: var(--display); font-size: clamp(2.1rem, 9vw, 3rem); font-weight: 700; text-align: center; line-height: 1.25; padding-block: 18px 6px; overflow-wrap: anywhere; text-wrap: balance; }
.word-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding-block: 18px 6px; }
.word-row .word { padding-block: 0; }
.speak { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 42px; height: 42px; flex: none; font-size: 1.1rem; display: grid; place-items: center; }
.speak.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.speak.small { width: 28px; height: 28px; font-size: .78rem; vertical-align: middle; display: inline-grid; flex: none; }
.card-top-end { display: inline-flex; align-items: center; gap: 8px; }
.word.long { font-size: clamp(1.5rem, 6vw, 2.1rem); }
.reveal { display: grid; justify-items: center; gap: 8px; min-height: 92px; align-content: center; }
.btn-reveal { border: 1.5px dashed var(--line); background: var(--bg); border-radius: 12px; padding: 12px 22px; font-weight: 600; color: var(--ink); width: 100%; }
kbd { font-family: var(--body); font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); }
.meaning { font-size: 1.25rem; font-weight: 600; text-align: center; text-wrap: balance; }
.meaning ol { margin: 0; padding: 0 1.2em 0 0; text-align: start; display: grid; gap: 4px; }
.hint-box { display: grid; gap: 8px; }
.note-img { display: block; max-width: 96px; max-height: 72px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; cursor: zoom-in; margin-top: 4px; }
.note-img.big { max-width: 100%; max-height: 360px; object-fit: contain; cursor: zoom-out; }
.composer { position: relative; }
.composer.drag textarea { outline: 2px dashed var(--accent); outline-offset: 2px; }
.img-btn { border: 1px solid var(--line) !important; background: var(--surface) !important; color: var(--ink) !important; padding: 8px 10px !important; font-size: 1.05rem; }
.img-preview { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
.img-preview img { max-width: 64px; max-height: 48px; border-radius: 6px; border: 1px solid var(--line); object-fit: cover; }
.img-preview button { border: 0; background: none; color: var(--red); font-weight: 700; font-size: .8rem; padding: 2px; }
.hint-box h4 { margin: 0; font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
/* How it works */
.how { display: grid; gap: 16px; padding-block: 8px 4px; }
.how-pill { justify-self: start; font-size: .8rem; font-weight: 600; color: var(--orange); background: var(--orange-soft); border: 1px solid color-mix(in srgb, var(--orange) 45%, transparent); border-radius: 99px; padding: 4px 12px; }
.how h2 { margin: 0; font-family: var(--display); font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.2; text-wrap: balance; }
.how-lead { margin: 0; color: var(--muted); font-size: 1.02rem; line-height: 1.65; max-width: 60ch; }
.how-steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.how-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: grid; gap: 8px; align-content: start; }
.how-num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--orange); background: var(--orange-soft); }
.how-card h3 { margin: 0; font-size: 1.05rem; }
.how-card p { margin: 0; color: var(--muted); line-height: 1.55; font-size: .93rem; }
.how-colors { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; color: var(--muted); font-size: .93rem; line-height: 1.45; }
.how-colors li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.how-colors b { color: var(--ink); margin-inline-end: 4px; }
.how-also { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.how-also p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
.how-also b { color: var(--ink); }
.how-start { justify-self: start; }
.locked { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.locked .link { font-size: .82rem; }
.undo-bar { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: .9rem; color: var(--muted); }
.undo-bar b { color: var(--ink); }
.undo-more { font-size: .8rem; }
.undo-bar button { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 10px; padding: 5px 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
@media (hover: none) { .undo-bar kbd { display: none; } }
.how-keys kbd { font-size: .8rem; padding: 1px 6px; margin-inline: 2px; }
@media (hover: none) { .how-keys { display: none; } }
/* Stats */
.stats { display: grid; gap: 14px; }
.stats-lang { margin: 0; color: var(--muted); font-size: .9rem; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.tile-n { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile-l { font-size: .8rem; color: var(--muted); }
.tile.hot { background: var(--orange-soft); border-color: color-mix(in srgb, var(--orange) 40%, transparent); }
.tile.up .tile-n { color: var(--green); }
.moves { display: flex; flex-wrap: wrap; gap: 6px; }
.move { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: .9rem; direction: ltr; }
.move b { font-variant-numeric: tabular-nums; }
.muted-note { color: var(--muted); font-size: .85rem; margin: 0; }
.stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.stat-card h3 { margin: 0; font-size: 1rem; }
.stat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; height: 130px; align-items: end; direction: ltr; }
.day { display: grid; grid-template-rows: auto 1fr auto; height: 100%; align-items: end; justify-items: center; gap: 3px; }
.day-bar { width: 100%; max-width: 22px; background: color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius: 5px 5px 2px 2px; align-self: end; }
.day.today .day-bar { background: var(--green); }
.day-n { font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-l { font-size: .66rem; color: var(--muted); white-space: nowrap; }
.day.today .day-l { color: var(--ink); font-weight: 700; }
.big-pct { font-size: 1.6rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
.big-pct small { font-size: .8rem; color: var(--muted); font-weight: 600; }
.stat-bar { height: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.milestone { margin: 0; font-size: .92rem; }
.units { display: grid; gap: 6px; }
.unit-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 2px; border-radius: 8px; text-align: start; }
.unit-name { font-size: .85rem; font-weight: 600; }
.unit-pct { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; }
.today-big { display: flex; align-items: baseline; gap: 8px; }
.today-big b { font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.today-big span { color: var(--muted); font-size: .9rem; }

function voiceFor(lang) {

  const ok = vs.filter((v) => want.some((w) => v.lang.toLowerCase().replace("_", "-").startsWith(w)));
  if (!ok.length) return null;
  const score = (v) => (/natural|neural|google|samantha|ava|aria|jenny|carmit|asaf/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1) + (v.lang.toLowerCase().startsWith(want[0]) ? 1 : 0);

}

const Stats = { enabled: () => true };   // the public build allows tracking for signed-in users only
const RANK = { n: 0, r: 1, o: 2, g: 3 };

function logRate(prev, s, sign = 1, lang = ui.lang, w = null) {
  if (!Stats.enabled()) return;
  const L = (state.l[lang] = state.l[lang] || {});
  const k = dayKey(), d = (L[k] = L[k] || { n: 0, up: 0, nw: 0, t: {} });
  d.t = d.t || {};
  d.n = Math.max(0, (d.n || 0) + sign);
  if (prev !== s) {
    if (prev === "n") d.nw = Math.max(0, (d.nw || 0) + sign);
    else if (RANK[s] > RANK[prev]) d.up = Math.max(0, (d.up || 0) + sign);
    const tk = prev + ">" + s;
    d.t[tk] = Math.max(0, (d.t[tk] || 0) + sign);
    if (!d.t[tk]) delete d.t[tk];
  }
  if (w) {
    d.w = d.w || {};
    const cur = d.w[w];
    if (sign > 0) d.w[w] = [cur ? cur[0] : prev, s, (cur ? cur[2] : 0) + 1];

  }
  const keys = Object.keys(L).sort();

}

  if (e.target.id === "gq") { clearTimeout(gTimer); const v = e.target.value; gTimer = setTimeout(() => globalSearch(v), 150); return; }
  if (e.target.id === "search") {
    query = e.target.value; listShown = PAGE;
    clearTimeout(searchTimer); searchTimer = setTimeout(renderListRows, 200);
  }
});
async function submitAssoc(form) {
  const box = form.closest(".assoc"), w = box.dataset.w, ta = form.querySelector("textarea"), btn = form.querySelector('button[type="submit"]');
  const text = ta.value.trim(), img = form._img || "";
  if (!text && !img) { ta.focus(); return; }
  btn.disabled = true;
  const ok = await Assoc.add(w, text.slice(0, 500), img);
  btn.disabled = false;
  if (!ok) { box.querySelector(".assoc-msg").textContent = "השמירה לא הצליחה. בדקו את החיבור לאינטרנט ונסו שוב."; return; }
  ta.value = ""; form._img = "";
  composerOpen.delete(w);   // saved: fold the box back to the small link
  refreshAssoc(w);
}
/* images: shrink in the browser to a small JPEG before saving */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("type"));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let side = 480, q = 0.72, out = "";
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, side / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length <= 150000) break;
        side = Math.round(side * 0.8); q = Math.max(0.5, q - 0.06);
      }
      URL.revokeObjectURL(url);
      out.length <= 150000 ? resolve(out) : reject(new Error("size"));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read")); };
    im.src = url;
  });
}
async function attachImage(form, file) {
  const msg = form.closest(".assoc").querySelector(".assoc-msg");
  try {
    form._img = await shrinkImage(file);
    msg.textContent = "";
    const pv = form.querySelector(".img-preview");
    pv.innerHTML = `<img src="${form._img}" alt="התמונה שנבחרה"><button type="button" class="img-remove">הסרת התמונה</button>`;
    pv.hidden = false;
  } catch (err) {
    msg.textContent = err.message === "type" ? "אפשר להוסיף רק קובץ תמונה." : "לא הצלחנו לקרוא את התמונה. נסו תמונה אחרת.";
  }
}
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("add-assoc")) {
    const box = t.closest(".assoc"); composerOpen.add(box.dataset.w);
    t.hidden = true; const f = box.querySelector(".composer"); f.hidden = false;
    if (!calmMotion()) f.animate([{ opacity: 0, transform: "translateY(-4px)" }, { opacity: 1, transform: "none" }], { duration: 180, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
    f.querySelector("textarea").focus();
    return;
  }
  if (t.classList && t.classList.contains("img-btn")) { t.closest(".composer").querySelector(".img-input").click(); return; }
  if (t.classList && t.classList.contains("img-remove")) { const f = t.closest(".composer"); f._img = ""; const pv = f.querySelector(".img-preview"); pv.innerHTML = ""; pv.hidden = true; return; }
  if (t.classList && t.classList.contains("note-img") && !t.closest(".img-preview")) { t.classList.toggle("big"); }
});
document.addEventListener("change", (e) => {
  if (e.target.classList && e.target.classList.contains("img-input") && e.target.files[0]) { attachImage(e.target.closest(".composer"), e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("dragover", (e) => {
  const f = e.target.closest && e.target.closest(".composer");
  if (f && Assoc.canImage()) { e.preventDefault(); f.classList.add("drag"); }
});
document.addEventListener("dragleave", (e) => { const f = e.target.closest && e.target.closest(".composer"); if (f) f.classList.remove("drag"); });
document.addEventListener("drop", (e) => {
  const f = e.target.closest && e.target.closest(".composer");
  if (!f || !Assoc.canImage()) return;
  e.preventDefault(); f.classList.remove("drag");
  const file = [...(e.dataTransfer?.files || [])].find((x) => /^image\//.test(x.type));
  if (file) attachImage(f, file);
});
document.addEventListener("paste", (e) => {
  const f = e.target.closest && e.target.closest(".composer");
  if (!f || !Assoc.canImage()) return;
  const file = [...(e.clipboardData?.files || [])].find((x) => /^image\//.test(x.type));
  if (file) { e.preventDefault(); attachImage(f, file); }
});
document.addEventListener("submit", (e) => {
  if (e.target.classList.contains("composer")) { e.preventDefault(); submitAssoc(e.target); return; }
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const w = $("newWord").value.trim(), m = $("newMeaning").value.trim();
  if (!w || !m) return;
  const existing = allWords().find((x) => plain(x.w) === plain(w));
  if (existing) { $("addMsg").textContent = `"${w}" כבר במילון${existing.u ? ` (יחידה ${existing.u})` : ""}.`; return; }
  state.c[ui.lang].push({ w, m }); save(ui.lang);
  ui.unit = "mine"; ui.filter.n = true; saveUI();
  resetView();
  $("addMsg").textContent = `"${w}" נוספה ל"המילים שלי".`;
});
document.addEventListener("keydown", (e) => {
  if (modalWord && e.key === "Escape") { closeWord(); return; }
  if (modalWord && !e.target.closest("textarea, input")) return;
  if (e.key === "Escape" && e.target.id === "gq") { e.target.value = ""; globalSearch(""); e.target.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z" || e.key === "ז") && !e.target.closest("textarea, input") && undoStack.length && ui.view === "practice") {
    e.preventDefault(); undoRate(); return;
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.closest(".composer") && matchMedia("(hover: hover)").matches) {
    e.preventDefault(); submitAssoc(e.target.closest(".composer")); return;
  }
  if (!DICT || ui.view !== "practice" || e.target.closest("textarea, input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") { if (e.target.closest("button")) return; e.preventDefault(); if (pos < queue.length) { revealed = !revealed; if (!revealed) hint = false; renderPractice(); } }
  else if ((e.key === "s" || e.key === "S" || e.key === "ד") && pos < queue.length) speakWord(queue[pos].w);
  else if (e.key === "1") rate("g"); else if (e.key === "2") rate("o"); else if (e.key === "3") rate("r");
  else if (e.key === "ArrowLeft") { if (pos < queue.length) { pos++; revealed = false; hint = false; renderPractice(); } }
  else if (e.key === "ArrowRight") { if (pos > 0) { pos--; revealed = false; hint = false; renderPractice(); } }
});

/* ---------- Saving: one document per language in the account, browser as fallback ---------- */
const refs = {}, timers = {}, writing = {}, dirty = {};
let cloudOn = false;
const SYNC_TEXT = {
  loading: "טוען את ההתקדמות שלך…",
  cloud: "ההתקדמות נשמרת בחשבון שלך",
  local: "ההתקדמות נשמרת בדפדפן הזה בלבד",
  offline: "אין חיבור לשמירה בחשבון כרגע, שומר בדפדפן",
  error: "השמירה בחשבון לא הצליחה, ההתקדמות שמורה בדפדפן",
  full: "אין מקום לשמור עוד בחשבון. ההתקדמות שמורה בדפדפן"
};
function setSync(s) { $("sync").dataset.state = s; $("syncText").textContent = SYNC_TEXT[s]; }
function save(lang) {
  lsSet(LS_STATE, state);
  if (!cloudOn || !refs[lang]) return;
  clearTimeout(timers[lang]); timers[lang] = setTimeout(() => flush(lang), 700);
}
async function flush(lang) {
  timers[lang] = null;
  if (!cloudOn || !refs[lang]) return;
  if (writing[lang]) { dirty[lang] = true; return; }
  writing[lang] = true;
  try { await refs[lang].set({ v: 2, p: state.p[lang], c: state.c[lang], l: state.l[lang] || {}, g: ui.goals, pl: planOut(ui.plans[lang]) }); setSync("cloud"); }
  catch (err) {
    const code = err && err.code;
    if (code === "invalid_argument" || code === "revoked" || code === "not_granted") { cloudOn = false; setSync("local"); }
    else if (code === "quota_exceeded") setSync("full");
    else setSync("error");
  }
  writing[lang] = false;
  if (dirty[lang]) { dirty[lang] = false; flush(lang); }
}
const busy = (l) => timers[l] || writing[l] || dirty[l];
const editing = () => !!document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
const langHasData = (l) => Object.keys(state.p[l]).length || state.c[l].length;

async function initCloud() {
  if (!window.claude || !window.claude.use) { setSync("local"); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { setSync("local"); return; }
    const uid = await user.id();
    if (!uid) { setSync("local"); return; }
    cloudOn = true; setSync("loading");
    let confirmed = 0;
    const timeout = setTimeout(() => { if (confirmed < 2) setSync("offline"); }, 10000);
    for (const lang of ["en", "he"]) {
      refs[lang] = db.collection("data/users/" + uid).doc(lang);
      let first = true;
      refs[lang].onSnapshot((snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const fresh = !snap.metadata.fromCache;
        if (snap.exists) {
          const remote = normLang(snap.data());
          const local = { p: state.p[lang], c: state.c[lang], l: state.l[lang] || {} };
          if (!busy(lang) && !editing() && JSON.stringify(remote) !== JSON.stringify(local)) {
            state.p[lang] = remote.p; state.c[lang] = remote.c; state.l[lang] = remote.l; lsSet(LS_STATE, state);
            applyRemoteGoals(lang, remote);
            if (DICT && ui.lang === lang) {
              if (ui.view === "practice") renderHeader(); else render();
            }
          }
        } else if (fresh && first && langHasData(lang)) {
          flush(lang);
        }
        if (fresh && first) { first = false; if (++confirmed === 2) { clearTimeout(timeout); setSync("cloud"); } }
      }, () => { clearTimeout(timeout); cloudOn = false; setSync("local"); });
    }
  } catch (e) { setSync("local"); }
}

/* ---------- Start ---------- */
state = normalize(lsGet(LS_STATE));
const savedUI = lsGet(LS_UI);
if (!savedUI) ui.view = "how";   // first visit: start with the explanation
if (savedUI && typeof savedUI === "object") {
  if (savedUI.lang === "en" || savedUI.lang === "he") ui.lang = savedUI.lang;
  if (["practice", "list", "how", "stats", "goals"].includes(savedUI.view)) ui.view = savedUI.view;
  if (savedUI.goals && typeof savedUI.goals === "object") ui.goals = Object.assign(ui.goals, savedUI.goals);
  if (savedUI.plans && typeof savedUI.plans === "object") ui.plans = savedUI.plans;
  for (const l of ["en", "he"]) { const pl = ui.plans[l]; if (pl && Array.isArray(pl.days)) pl.days = pl.days.map((d) => (Array.isArray(d) ? d.map(renameWord) : d)); }
  // goals saved before syncing existed have no timestamp: stamp them so other devices accept them
  if (!ui.goals._t && (ui.goals.exam || ui.goals.mode === "manual")) ui.goals._t = 1;
  for (const l of ["en", "he"]) { const pl = ui.plans[l]; if (pl && Array.isArray(pl.days) && !pl.created) pl.created = 1; }
  if (typeof savedUI.unit === "string") ui.unit = savedUI.unit;
  if (savedUI.filter) for (const k of CHIP_ORDER) if (typeof savedUI.filter[k] === "boolean") ui.filter[k] = savedUI.filter[k];
  if (typeof savedUI.shuffle === "boolean") ui.shuffle = savedUI.shuffle;
  if ([10, 20, 30, 50].includes(savedUI.goal)) ui.goal = savedUI.goal;
}
renderHeader(); setSync("local"); Nav.init();
fetch("words.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DICT = { en: d.en, he: d.he };
  buildQueue(); render();
}).catch(() => {
  $("main").innerHTML = `<div class="empty"><h2>המילון לא נטען</h2><p>בדקו את החיבור לאינטרנט ורעננו את הדף.</p></div>`;
});
initCloud();
</script>
